<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Art Déco · Monde</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'"/>

<style>
:root {
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --gold: #c9a84c;
  --gold2: #e8c96a;
  --gold-dim: #7a6130;
  --ink: #0a0806;
  --ink2: #120f0a;
  --ink3: #1e1810;
  --cream: #f0e6c8;
  --cream2: #d4c49a;
  --text: #e8dfc8;
  --muted: #8a7d62;
  --tab-h: 62px;
  --header-h: 56px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Josefin Sans', 'Helvetica Neue', sans-serif;
  background: var(--ink);
  color: var(--text);
  overscroll-behavior: none;
  user-select: none;
}

/* ═══════════════ SHELL ═══════════════ */
#app {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  display: flex; flex-direction: column;
  padding-top: var(--safe-top);
  background: var(--ink);
}

/* ═══════════════ HEADER ═══════════════ */
#header {
  height: var(--header-h);
  background: var(--ink2);
  border-bottom: 1px solid var(--gold-dim);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px;
  flex-shrink: 0;
  position: relative;
}
#header::after {
  content: '';
  position: absolute; bottom: -3px; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}

.header-title {
  display: flex; flex-direction: column; align-items: center;
  position: absolute; left: 50%; transform: translateX(-50%);
}
.header-title .main {
  font-family: 'Josefin Sans', sans-serif;
  font-size: 15px; font-weight: 600; letter-spacing: 4px; text-transform: uppercase;
  color: var(--gold);
}
.header-title .sub {
  font-family: 'Cormorant Garamond', serif;
  font-size: 11px; letter-spacing: 2px; color: var(--muted); font-style: italic;
}

.header-btn {
  width: 36px; height: 36px; border: none; background: none;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; border-radius: 50%; transition: background .2s;
  color: var(--gold); font-size: 18px;
}
.header-btn:active { background: rgba(201,168,76,.15); }

/* ═══════════════ CONTENT ═══════════════ */
#content {
  flex: 1; overflow: hidden; position: relative;
}

.tab-panel {
  position: absolute; inset: 0;
  display: none; flex-direction: column;
  overflow: hidden;
}
.tab-panel.active { display: flex; }

/* ═══════════════ LISTE ═══════════════ */
#list-container {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 8px 0 8px;
}

/* Filtre continent */
#filter-bar {
  display: flex; gap: 6px; padding: 10px 14px 6px; overflow-x: auto;
  -webkit-overflow-scrolling: touch; flex-shrink: 0;
  scrollbar-width: none;
}
#filter-bar::-webkit-scrollbar { display: none; }

.filter-chip {
  border: 1px solid var(--gold-dim);
  background: transparent; color: var(--muted);
  font-family: 'Josefin Sans', sans-serif;
  font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
  padding: 5px 12px; border-radius: 2px; white-space: nowrap;
  cursor: pointer; transition: all .2s; flex-shrink: 0;
}
.filter-chip.active {
  background: var(--gold); color: var(--ink); border-color: var(--gold);
  font-weight: 600;
}

.building-card {
  display: flex; align-items: center; gap: 14px;
  padding: 13px 16px;
  border-bottom: 1px solid rgba(201,168,76,.12);
  cursor: pointer; transition: background .15s;
  position: relative;
}
.building-card:active { background: rgba(201,168,76,.07); }

.card-img {
  width: 68px; height: 68px; border-radius: 2px;
  object-fit: cover; background: var(--ink3);
  flex-shrink: 0; border: 1px solid var(--gold-dim);
}
.card-img-placeholder {
  width: 68px; height: 68px; border-radius: 2px; flex-shrink: 0;
  background: var(--ink3); border: 1px solid var(--gold-dim);
  display: flex; align-items: center; justify-content: center;
  font-size: 26px;
}

.card-info { flex: 1; min-width: 0; }
.card-name {
  font-family: 'Josefin Sans', sans-serif;
  font-size: 14px; font-weight: 600; letter-spacing: .5px;
  color: var(--cream); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card-city {
  font-size: 12px; color: var(--gold); letter-spacing: 1px; margin-top: 2px;
}
.card-year {
  font-family: 'Cormorant Garamond', serif;
  font-size: 11px; color: var(--muted); margin-top: 3px; letter-spacing: .5px;
}
.card-chevron { color: var(--gold-dim); font-size: 14px; flex-shrink: 0; }

/* ═══════════════ DETAIL OVERLAY ═══════════════ */
#detail-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: var(--ink);
  transform: translateX(100%);
  transition: transform .3s cubic-bezier(.4,0,.2,1);
  display: flex; flex-direction: column;
  padding-top: var(--safe-top);
}
#detail-overlay.open { transform: translateX(0); }

#detail-header {
  height: var(--header-h);
  display: flex; align-items: center; gap: 12px;
  padding: 0 16px; border-bottom: 1px solid var(--gold-dim);
  flex-shrink: 0; background: var(--ink2);
}
#detail-back {
  width: 36px; height: 36px; border: none; background: none;
  color: var(--gold); font-size: 22px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
#detail-title {
  font-family: 'Josefin Sans', sans-serif;
  font-size: 14px; letter-spacing: 2px; color: var(--gold); text-transform: uppercase;
  flex: 1; text-align: center;
}
#detail-spacer { width: 36px; }

#detail-scroll {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
}

#detail-hero {
  width: 100%; aspect-ratio: 4/3; object-fit: cover;
  background: var(--ink3); display: block;
}
#detail-hero-placeholder {
  width: 100%; aspect-ratio: 4/3;
  background: var(--ink3);
  display: flex; align-items: center; justify-content: center;
  font-size: 72px;
}

.detail-body { padding: 20px 18px 32px; }

.detail-building-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 28px; font-weight: 600; color: var(--cream);
  line-height: 1.2; margin-bottom: 4px;
}
.detail-location {
  font-family: 'Josefin Sans', sans-serif;
  font-size: 12px; letter-spacing: 2px; color: var(--gold);
  text-transform: uppercase; margin-bottom: 16px;
}

.detail-meta-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; margin-bottom: 20px;
}
.meta-item {
  background: var(--ink3); border: 1px solid rgba(201,168,76,.2);
  border-radius: 2px; padding: 10px 12px;
}
.meta-label {
  font-size: 9px; letter-spacing: 2px; color: var(--muted);
  text-transform: uppercase; margin-bottom: 3px;
}
.meta-value {
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px; color: var(--cream);
}

.detail-divider {
  height: 1px; margin: 18px 0;
  background: linear-gradient(90deg, var(--gold-dim), transparent);
}

.detail-desc {
  font-family: 'Cormorant Garamond', serif;
  font-size: 17px; line-height: 1.7; color: var(--cream2);
}

.wiki-btn {
  margin-top: 22px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--gold-dim); border-radius: 2px; padding: 13px;
  color: var(--gold); background: transparent; width: 100%; cursor: pointer;
  font-family: 'Josefin Sans', sans-serif;
  font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
  transition: background .2s;
}
.wiki-btn:active { background: rgba(201,168,76,.1); }

/* ═══════════════ CARTE ═══════════════ */
#map { flex: 1; }

/* ═══════════════ QUIZ ═══════════════ */
#quiz-panel {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 20px 16px;
}

.quiz-score-bar {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 20px;
}
.quiz-score-label {
  font-size: 11px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase;
}
.quiz-score-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 24px; color: var(--gold);
}
.quiz-progress {
  height: 2px; background: var(--ink3); border-radius: 1px; margin-bottom: 24px;
}
.quiz-progress-fill {
  height: 100%; background: var(--gold); border-radius: 1px; transition: width .4s;
}

.quiz-question-img {
  width: 100%; aspect-ratio: 16/9; object-fit: cover;
  border-radius: 2px; border: 1px solid var(--gold-dim);
  background: var(--ink3); margin-bottom: 16px;
}
.quiz-question-img-placeholder {
  width: 100%; aspect-ratio: 16/9;
  background: var(--ink3); border: 1px solid var(--gold-dim);
  border-radius: 2px; margin-bottom: 16px;
  display: flex; align-items: center; justify-content: center; font-size: 52px;
}

.quiz-question {
  font-family: 'Josefin Sans', sans-serif;
  font-size: 13px; letter-spacing: 1.5px; color: var(--muted);
  text-transform: uppercase; margin-bottom: 8px;
}
.quiz-hint {
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px; color: var(--cream2); margin-bottom: 20px; line-height: 1.4;
}

.quiz-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
.quiz-option {
  border: 1px solid rgba(201,168,76,.3); border-radius: 2px; padding: 14px 16px;
  background: transparent; color: var(--text); text-align: left; cursor: pointer;
  font-family: 'Josefin Sans', sans-serif; font-size: 13px; letter-spacing: .5px;
  transition: all .2s;
}
.quiz-option:active { transform: scale(.98); }
.quiz-option.correct { background: rgba(100,180,80,.2); border-color: #64b450; color: #8be077; }
.quiz-option.wrong { background: rgba(180,60,60,.2); border-color: #b43c3c; color: #e07777; }

.quiz-next-btn {
  width: 100%; padding: 15px; border: 1px solid var(--gold);
  background: rgba(201,168,76,.1); color: var(--gold);
  font-family: 'Josefin Sans', sans-serif;
  font-size: 12px; letter-spacing: 3px; text-transform: uppercase;
  border-radius: 2px; cursor: pointer; transition: background .2s; display: none;
}
.quiz-next-btn:active { background: rgba(201,168,76,.25); }
.quiz-next-btn.visible { display: block; }

.quiz-result {
  display: none; text-align: center; padding: 40px 20px;
}
.quiz-result.visible { display: block; }
.quiz-result-emoji { font-size: 64px; margin-bottom: 16px; }
.quiz-result-score {
  font-family: 'Cormorant Garamond', serif;
  font-size: 48px; color: var(--gold); line-height: 1;
}
.quiz-result-label {
  font-size: 11px; letter-spacing: 2px; color: var(--muted);
  text-transform: uppercase; margin: 8px 0 24px;
}
.quiz-result-msg {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px; color: var(--cream2); margin-bottom: 28px;
}
.quiz-restart {
  border: 1px solid var(--gold); background: transparent;
  color: var(--gold); padding: 13px 32px;
  font-family: 'Josefin Sans', sans-serif;
  font-size: 12px; letter-spacing: 3px; text-transform: uppercase;
  border-radius: 2px; cursor: pointer;
}

/* ═══════════════ TAB BAR ═══════════════ */
#tabbar {
  height: calc(var(--tab-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: var(--ink2);
  border-top: 1px solid var(--gold-dim);
  display: flex; flex-shrink: 0;
  position: relative;
}
#tabbar::before {
  content: '';
  position: absolute; top: -2px; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}

.tab-btn {
  flex: 1; border: none; background: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; transition: opacity .2s;
}
.tab-icon { font-size: 20px; }
.tab-label {
  font-family: 'Josefin Sans', sans-serif;
  font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--muted);
}
.tab-btn.active .tab-icon { filter: drop-shadow(0 0 4px var(--gold)); }
.tab-btn.active .tab-label { color: var(--gold); }

/* ═══════════════ SETTINGS ═══════════════ */
#settings-overlay {
  position: fixed; inset: 0; z-index: 300;
  display: none; flex-direction: column;
  padding-top: var(--safe-top);
}
#settings-overlay.open { display: flex; }

#settings-backdrop {
  position: absolute; inset: 0; background: rgba(0,0,0,.7);
}

#settings-panel {
  position: relative; z-index: 1;
  margin-top: auto;
  background: var(--ink2);
  border-top: 1px solid var(--gold-dim);
  border-radius: 8px 8px 0 0;
  padding-bottom: var(--safe-bottom);
  display: flex; flex-direction: column;
  max-height: 70vh;
}
.settings-header {
  padding: 18px 20px 12px;
  border-bottom: 1px solid rgba(201,168,76,.2);
  display: flex; justify-content: space-between; align-items: center;
  flex-shrink: 0;
}
.settings-title {
  font-family: 'Josefin Sans', sans-serif;
  font-size: 11px; letter-spacing: 3px; color: var(--gold); text-transform: uppercase;
}
.settings-close-btn {
  font-size: 20px; color: var(--muted); background: none; border: none; cursor: pointer;
}
.settings-content { overflow-y: auto; padding: 16px 20px; }
.settings-section-title {
  font-size: 9px; letter-spacing: 2px; color: var(--muted);
  text-transform: uppercase; margin-bottom: 12px; margin-top: 4px;
}
.settings-app-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 0; border-bottom: 1px solid rgba(201,168,76,.08);
  cursor: pointer;
}
.settings-app-icon {
  width: 40px; height: 40px; border-radius: 8px; background: var(--ink3);
  border: 1px solid var(--gold-dim); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 20px;
}
.settings-app-name {
  font-family: 'Josefin Sans', sans-serif;
  font-size: 13px; color: var(--cream);
}
.settings-app-store {
  font-size: 10px; color: var(--muted); letter-spacing: 1px;
}

/* ═══════════════ LANG TOGGLE ═══════════════ */
#lang-btn {
  font-size: 20px; cursor: pointer;
}

/* Leaflet popup dark */
.leaflet-popup-content-wrapper {
  background: var(--ink2) !important; border: 1px solid var(--gold-dim) !important;
  border-radius: 2px !important; color: var(--text) !important;
}
.leaflet-popup-tip { background: var(--ink2) !important; }
.leaflet-popup-content { font-family: 'Josefin Sans', sans-serif; font-size: 12px !important; }
.popup-name { color: var(--gold); font-weight: 600; letter-spacing: .5px; margin-bottom: 2px; }
.popup-sub { color: var(--muted); font-size: 11px; }
.popup-link { color: var(--gold2); font-size: 11px; cursor: pointer; margin-top: 4px; display: inline-block; }

/* Spinner */
.spinner {
  width: 20px; height: 20px; border: 2px solid var(--gold-dim);
  border-top-color: var(--gold); border-radius: 50%;
  animation: spin .8s linear infinite;
  margin: 40px auto;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Geometric deco motif header */
.deco-bar {
  display: flex; align-items: center; gap: 8px; padding: 0 16px; height: 24px;
  background: linear-gradient(90deg, var(--ink), rgba(201,168,76,.08), var(--ink));
  flex-shrink: 0;
}
.deco-line { flex: 1; height: 1px; background: rgba(201,168,76,.2); }
.deco-diamond {
  width: 6px; height: 6px; background: var(--gold-dim);
  transform: rotate(45deg); flex-shrink: 0;
}
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div id="header">
    <button class="header-btn" id="lang-btn" onclick="toggleLang()">🇬🇧</button>
    <div class="header-title">
      <span class="main" id="header-main">Art Déco</span>
      <span class="sub" id="header-sub">Monuments du Monde</span>
    </div>
    <button class="header-btn" onclick="openSettings()">⚙️</button>
  </div>

  <!-- CONTENT -->
  <div id="content">

    <!-- LISTE -->
    <div id="panel-liste" class="tab-panel active">
      <div id="filter-bar"></div>
      <div class="deco-bar"><div class="deco-line"></div><div class="deco-diamond"></div><div class="deco-line"></div></div>
      <div id="list-container"></div>
    </div>

    <!-- CARTE -->
    <div id="panel-carte" class="tab-panel">
      <div id="map"></div>
    </div>

    <!-- QUIZ -->
    <div id="panel-quiz" class="tab-panel">
      <div id="quiz-panel"></div>
    </div>

  </div>

  <!-- TAB BAR -->
  <div id="tabbar">
    <button class="tab-btn active" id="tab-liste" onclick="switchTab('liste')">
      <span class="tab-icon">🏛️</span>
      <span class="tab-label" data-fr="Liste" data-en="List">Liste</span>
    </button>
    <button class="tab-btn" id="tab-carte" onclick="switchTab('carte')">
      <span class="tab-icon">🗺️</span>
      <span class="tab-label" data-fr="Carte" data-en="Map">Carte</span>
    </button>
    <button class="tab-btn" id="tab-quiz" onclick="switchTab('quiz')">
      <span class="tab-icon">❓</span>
      <span class="tab-label" data-fr="Quiz" data-en="Quiz">Quiz</span>
    </button>
  </div>
</div>

<!-- DETAIL OVERLAY -->
<div id="detail-overlay">
  <div id="detail-header">
    <button id="detail-back" onclick="closeDetail()">‹</button>
    <div id="detail-title"></div>
    <div id="detail-spacer"></div>
  </div>
  <div id="detail-scroll">
    <div id="detail-hero-wrap"></div>
    <div class="detail-body" id="detail-body"></div>
  </div>
</div>

<!-- SETTINGS OVERLAY -->
<div id="settings-overlay">
  <div id="settings-backdrop" onclick="closeSettings()"></div>
  <div id="settings-panel">
    <div class="settings-header">
      <span class="settings-title" id="set-title">Réglages</span>
      <button class="settings-close-btn" onclick="closeSettings()">✕</button>
    </div>
    <div class="settings-content" id="settings-content"></div>
  </div>
</div>

<script>
'use strict';

// ═══════════════ CONFIG ═══════════════
const MGA_CONFIG = {
  appCourante: 'artdeco',
  apps: [
    { id:'rois',    icon:'👑', fr:'Rois de France',         en:'Kings of France',           store:'https://apps.apple.com/app/id6761323546' },
    { id:'pres',    icon:'🎖️', fr:'Présidents de la Rép.',  en:'Presidents of France',       store:'https://apps.apple.com/app/id6761424444' },
    { id:'senat',   icon:'⚖️', fr:'Présidents du Sénat',    en:'Senate Presidents',          store:'https://apps.apple.com/app/id6764000000' },
    { id:'academie',icon:'📜', fr:'Académie française',     en:'Académie française',         store:'https://apps.apple.com/app/id6761334922' },
    { id:'chateaux',icon:'🏰', fr:'Châteaux de la Loire',   en:'Loire Valley Castles',       store:'https://apps.apple.com/app/id6761000000' },
    { id:'theatres',icon:'🎭', fr:'Théâtres de Paris',      en:'Paris Theatres',             store:'https://apps.apple.com/app/id6760929391' },
    { id:'musees',  icon:'🎨', fr:'Musées de Paris',        en:'Paris Museums',              store:'https://apps.apple.com/app/id6760890465' },
  ]
};

// ═══════════════ LANG ═══════════════
let lang = localStorage.getItem('artdeco_lang') || 'fr';
function t(obj) { return (typeof obj === 'string') ? obj : (obj[lang] || obj.fr); }
function toggleLang() {
  lang = (lang === 'fr') ? 'en' : 'fr';
  localStorage.setItem('artdeco_lang', lang);
  document.getElementById('lang-btn').textContent = lang === 'fr' ? '🇬🇧' : '🇫🇷';
  applyLang();
  renderList();
  if (currentDetail !== null) openDetail(currentDetail);
}
function applyLang() {
  document.getElementById('header-sub').textContent = lang === 'fr' ? 'Monuments du Monde' : 'World Monuments';
  document.getElementById('set-title').textContent = lang === 'fr' ? 'Réglages' : 'Settings';
  document.querySelectorAll('[data-fr]').forEach(el => {
    el.textContent = el.dataset[lang] || el.dataset.fr;
  });
  document.getElementById('lang-btn').textContent = lang === 'fr' ? '🇬🇧' : '🇫🇷';
}

// ═══════════════ DATA ═══════════════
const BUILDINGS = [
  // ── ÉTATS-UNIS ──
  {
    id:1, emoji:'🗽', continent:'americas',
    name:{ fr:'Chrysler Building', en:'Chrysler Building' },
    city:{ fr:'New York', en:'New York' }, country:{ fr:'États-Unis', en:'United States' },
    year:1930, archi:'William Van Alen', height:'319 m',
    lat:40.7516, lng:-73.9755,
    wiki:'Chrysler_Building', commonsImg:'Chrysler_Building_by_David_Shankbone_edited.jpg', wikiFallback:['Chrysler_Building,_New_York_City'],

// ═══════════════ IMAGE CACHE ═══════════════
const IMG_CACHE_VERSION = 'artdeco_v8_';
const IMG_CACHE_DAYS = 7;

function getCachedImg(key) {
  const k = IMG_CACHE_VERSION + key;
  try {
    const raw = localStorage.getItem(k);
    if (!raw) return null;
    const { url, ts } = JSON.parse(raw);
    if (Date.now() - ts > IMG_CACHE_DAYS * 864e5) { localStorage.removeItem(k); return null; }
    return url;
  } catch { return null; }
}

function setCachedImg(key, url) {
  try { localStorage.setItem(IMG_CACHE_VERSION + key, JSON.stringify({ url, ts: Date.now() })); } catch {}
}

async function wikiPageImg(slug, lang, size) {
  try {
    const u = `https://${lang}.wikipedia.org/w/api.php?action=query&titles=${slug}&prop=pageimages&piprop=thumbnail&pithumbsize=${size}&redirects&format=json&origin=*`;
    const d = await (await fetch(u)).json();
    const p = Object.values(d?.query?.pages || {})[0];
    if (p && p.missing === undefined && p.thumbnail?.source) return p.thumbnail.source;
    return null;
  } catch { return null; }
}

async function commonsSearch(query, size) {
  try {
    // Search Commons for photos of the building
    const u = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrnamespace=6&gsrlimit=8&prop=imageinfo&iiprop=url&iiurlwidth=${size}&format=json&origin=*`;
    const d = await (await fetch(u)).json();
    const pages = Object.values(d?.query?.pages || {});
    for (const p of pages) {
      const url = p?.imageinfo?.[0]?.thumburl;
      // Only accept JPEGs (real photos, not SVG diagrams)
      if (url && /\.jpe?g/i.test(url)) return url;
    }
    return null;
  } catch { return null; }
}

async function fetchWikiImg(b, size = 400) {
  const cacheKey = b.wiki + (b.wikiLang || 'en');
  const cached = getCachedImg(cacheKey);
  if (cached && cached !== '__none__') return cached;
  if (cached === '__none__') return null;

  const lang = b.wikiLang || 'en';

  // Step 1: Wikipedia pageimages (lead photo)
  const slugs = [b.wiki, ...(b.wikiFallback || [])];
  for (const slug of slugs) {
    const url = await wikiPageImg(slug, lang, size);
    if (url) { setCachedImg(cacheKey, url); return url; }
  }

  // Step 2: Commons full-text search by building name + city
  const query = b.commonsQuery || `${b.name.en} ${b.city.en} building`;
  const url2 = await commonsSearch(query, size);
  if (url2) { setCachedImg(cacheKey, url2); return url2; }

  setCachedImg(cacheKey, '__none__');
  return null;
}

// ═══════════════ LISTE ═══════════════
let activeContinent = 'all';

function renderFilterBar() {
  const bar = document.getElementById('filter-bar');
  bar.innerHTML = Object.entries(CONTINENTS).map(([k, v]) =>
    `<button class="filter-chip ${k === activeContinent ? 'active' : ''}" onclick="setContinent('${k}')">${t(v)}</button>`
  ).join('');
}

function setContinent(c) {
  activeContinent = c;
  renderFilterBar();
  renderList();
}

function filteredBuildings() {
  if (activeContinent === 'all') return BUILDINGS;
  return BUILDINGS.filter(b => b.continent === activeContinent);
}

function renderList() {
  renderFilterBar();
  const container = document.getElementById('list-container');
  const list = filteredBuildings();
  container.innerHTML = list.map(b => `
    <div class="building-card" onclick="openDetail(${b.id})">
      <div class="card-img-placeholder" id="thumb-${b.id}">${b.emoji}</div>
      <div class="card-info">
        <div class="card-name">${t(b.name)}</div>
        <div class="card-city">${t(b.city)} · ${t(b.country)}</div>
        <div class="card-year">${b.year}${b.archi ? ' · ' + b.archi : ''}</div>
      </div>
      <div class="card-chevron">›</div>
    </div>
  `).join('');

  // Lazy-load thumbnails
  list.forEach(b => {
    fetchWikiImg(b, 200).then(url => {
      if (!url || url === '__none__') return;
      const el = document.getElementById('thumb-' + b.id);
      if (el) {
        const img = document.createElement('img');
        img.className = 'card-img'; img.src = url; img.alt = t(b.name);
        el.replaceWith(img);
      }
    });
  });
}

// ═══════════════ DETAIL ═══════════════
let currentDetail = null;

async function openDetail(id) {
  const b = BUILDINGS.find(x => x.id === id);
  if (!b) return;
  currentDetail = id;

  document.getElementById('detail-title').textContent = t(b.name).toUpperCase();

  // Hero
  const heroWrap = document.getElementById('detail-hero-wrap');
  heroWrap.innerHTML = `<div class="detail-hero-placeholder" id="hero-ph">${b.emoji}</div>`;
  fetchWikiImg(b, 800).then(url => {
    if (!url || url === '__none__') return;
    const ph = document.getElementById('hero-ph');
    if (ph) {
      const img = document.createElement('img');
      img.id = 'detail-hero'; img.src = url; img.alt = t(b.name);
      ph.replaceWith(img);
    }
  });

  // Body
  const metaYear = lang === 'fr' ? 'Année' : 'Year';
  const metaArchi = lang === 'fr' ? 'Architecte' : 'Architect';
  const metaHaut = lang === 'fr' ? 'Hauteur' : 'Height';
  const metaPays = lang === 'fr' ? 'Pays' : 'Country';
  const wikiLabel = lang === 'fr' ? 'Voir sur Wikipédia' : 'View on Wikipedia';

  document.getElementById('detail-body').innerHTML = `
    <div class="detail-building-name">${t(b.name)}</div>
    <div class="detail-location">${t(b.city)} · ${t(b.country)}</div>
    <div class="detail-meta-grid">
      <div class="meta-item"><div class="meta-label">${metaYear}</div><div class="meta-value">${b.year}</div></div>
      <div class="meta-item"><div class="meta-label">${metaPays}</div><div class="meta-value">${t(b.country)}</div></div>
      ${b.archi ? `<div class="meta-item" style="grid-column:1/-1"><div class="meta-label">${metaArchi}</div><div class="meta-value">${b.archi}</div></div>` : ''}
      ${b.height ? `<div class="meta-item"><div class="meta-label">${metaHaut}</div><div class="meta-value">${b.height}</div></div>` : ''}
    </div>
    <div class="detail-divider"></div>
    <div class="detail-desc">${t(b.desc)}</div>
    <div onclick="window.open('https://fr.wikipedia.org/wiki/${b.wiki}','_system')" class="wiki-btn">
      <span>📖</span><span>${wikiLabel}</span>
    </div>
  `;

  document.getElementById('detail-overlay').classList.add('open');
  document.getElementById('detail-scroll').scrollTop = 0;
}

function closeDetail() {
  document.getElementById('detail-overlay').classList.remove('open');
  currentDetail = null;
}

// ═══════════════ CARTE ═══════════════
let mapInited = false;
let leafletMap = null;

function initMap() {
  if (mapInited) return;
  mapInited = true;
  setTimeout(() => {
    leafletMap = L.map('map', { zoomControl: true }).setView([20, 0], 2);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '© CartoDB', maxZoom: 18
    }).addTo(leafletMap);

    const goldIcon = L.divIcon({
      className: '',
      html: `<div style="width:28px;height:28px;background:#c9a84c;border-radius:50%;border:2px solid #e8c96a;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 0 8px rgba(201,168,76,.5)"></div>`,
      iconSize: [28, 28], iconAnchor: [14, 14]
    });

    BUILDINGS.forEach(b => {
      const marker = L.marker([b.lat, b.lng], { icon: goldIcon }).addTo(leafletMap);
      marker.bindPopup(`
        <div class="popup-name">${b.name.fr}</div>
        <div class="popup-sub">${b.city.fr} · ${b.year}</div>
        <div class="popup-link" onclick="switchTab('liste');openDetail(${b.id})">→ ${lang==='fr'?'Voir le détail':'View detail'}</div>
      `);
    });
  }, 100);
}

// ═══════════════ QUIZ ═══════════════
let quizData = { questions:[], current:0, score:0, answered:false };

function initQuiz() {
  const shuffled = [...BUILDINGS].sort(() => Math.random() - .5).slice(0, 10);
  quizData = { questions: shuffled, current: 0, score: 0, answered: false };
  renderQuiz();
}

function renderQuiz() {
  const panel = document.getElementById('quiz-panel');
  const { questions, current, score } = quizData;

  if (current >= questions.length) {
    const pct = Math.round(score / questions.length * 100);
    const emoji = pct >= 80 ? '🏆' : pct >= 50 ? '🎭' : '📚';
    const msg = lang === 'fr'
      ? (pct >= 80 ? 'Vous êtes un véritable connaisseur de l\'Art Déco !' : pct >= 50 ? 'Bonne connaissance de l\'architecture !' : 'Continuez à explorer ce beau patrimoine !')
      : (pct >= 80 ? 'You are a true Art Deco connoisseur!' : pct >= 50 ? 'Good knowledge of architecture!' : 'Keep exploring this beautiful heritage!');
    const lbl = lang === 'fr' ? 'Score' : 'Score';
    const restart = lang === 'fr' ? 'Recommencer' : 'Try Again';
    panel.innerHTML = `
      <div class="quiz-result visible">
        <div class="quiz-result-emoji">${emoji}</div>
        <div class="quiz-result-score">${score}/${questions.length}</div>
        <div class="quiz-result-label">${lbl}</div>
        <div class="quiz-result-msg">${msg}</div>
        <button class="quiz-restart" onclick="initQuiz()">${restart}</button>
      </div>`;
    return;
  }

  const b = questions[current];
  const others = BUILDINGS.filter(x => x.id !== b.id).sort(() => Math.random() - .5).slice(0, 3);
  const options = [...others, b].sort(() => Math.random() - .5);
  const qLabel = lang === 'fr' ? 'Quel est ce bâtiment ?' : 'Which building is this?';
  const hintCity = lang === 'fr' ? `Construit en ${b.year} · ${t(b.city)}, ${t(b.country)}` : `Built in ${b.year} · ${t(b.city)}, ${t(b.country)}`;
  const nextLabel = lang === 'fr' ? 'Question suivante →' : 'Next question →';
  const progress = `${current + 1}/${questions.length}`;
  const pctW = Math.round(current / questions.length * 100);

  panel.innerHTML = `
    <div class="quiz-score-bar">
      <span class="quiz-score-label">${lang==='fr'?'Score':'Score'}</span>
      <span class="quiz-score-num">${score} · ${progress}</span>
    </div>
    <div class="quiz-progress"><div class="quiz-progress-fill" style="width:${pctW}%"></div></div>
    <div class="quiz-question-img-placeholder" id="quiz-img-ph">${b.emoji}</div>
    <div class="quiz-question">${qLabel}</div>
    <div class="quiz-hint">${hintCity}</div>
    <div class="quiz-options">
      ${options.map(o => `
        <button class="quiz-option" onclick="answerQuiz(${o.id},${b.id},this)">${t(o.name)}</button>
      `).join('')}
    </div>
    <button class="quiz-next-btn" id="quiz-next" onclick="nextQuiz()">${nextLabel}</button>
  `;

  fetchWikiImg(b, 600).then(url => {
    if (!url || url === '__none__') return;
    const ph = document.getElementById('quiz-img-ph');
    if (ph) {
      const img = document.createElement('img');
      img.className = 'quiz-question-img'; img.src = url; img.alt = t(b.name);
      ph.replaceWith(img);
    }
  });
}

function answerQuiz(chosen, correct, btn) {
  if (quizData.answered) return;
  quizData.answered = true;
  const isRight = chosen === correct;
  if (isRight) { quizData.score++; btn.classList.add('correct'); }
  else {
    btn.classList.add('wrong');
    document.querySelectorAll('.quiz-option').forEach(b => {
      const id = parseInt(b.getAttribute('onclick').match(/answerQuiz\((\d+)/)?.[1] || 0);
      // find the button whose text matches the correct building
    });
    // highlight correct
    document.querySelectorAll('.quiz-option').forEach(b => {
      if (b.textContent.trim() === t(BUILDINGS.find(x=>x.id===correct).name)) b.classList.add('correct');
    });
  }
  document.querySelectorAll('.quiz-option').forEach(b => b.disabled = true);
  document.getElementById('quiz-next').classList.add('visible');
}

function nextQuiz() {
  quizData.current++;
  quizData.answered = false;
  renderQuiz();
}

// ═══════════════ TABS ═══════════════
function switchTab(tab) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + tab).classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
  if (tab === 'carte') initMap();
  if (tab === 'quiz') { if (!quizData.questions.length) initQuiz(); }
}

// ═══════════════ SETTINGS ═══════════════
function openSettings() {
  const content = document.getElementById('settings-content');
  const appLabel = lang === 'fr' ? 'Nos autres applications' : 'Our other apps';
  const others = MGA_CONFIG.apps.filter(a => a.id !== MGA_CONFIG.appCourante);
  content.innerHTML = `
    <div class="settings-section-title">${appLabel}</div>
    ${others.map(a => `
      <div class="settings-app-row" onclick="window.open('${a.store}','_system')">
        <div class="settings-app-icon">${a.icon}</div>
        <div>
          <div class="settings-app-name">${lang==='fr'?a.fr:a.en}</div>
          <div class="settings-app-store">App Store →</div>
        </div>
      </div>
    `).join('')}
  `;
  document.getElementById('settings-overlay').classList.add('open');
}

function closeSettings() {
  document.getElementById('settings-overlay').classList.remove('open');
}

// ═══════════════ INIT ═══════════════
applyLang();
renderList();
</script>
</body>
</html>
